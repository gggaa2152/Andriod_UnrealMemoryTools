name: Build libUnrealMemoryTools.so (Hook 注入模式)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: NDK Build (arm64-v8a)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android NDK r25c
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          add-to-path: false

      - name: Install ninja
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build cmake

      - name: Configure & Build (UnrealMemoryTools)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_SYSTEM_NAME=Android
          cmake --build build -j $(nproc)

      - name: Configure & Build (injector)
        run: |
          cmake -S injector -B build-injector -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_SYSTEM_NAME=Android
          cmake --build build-injector -j $(nproc)

      - name: List outputs
        run: |
          ls -lh outputs/arm64-v8a/
          ls -lh injector/outputs/arm64-v8a/

      - name: Upload libUnrealMemoryTools.so
        uses: actions/upload-artifact@v4
        with:
          name: libUnrealMemoryTools-arm64-v8a
          path: outputs/arm64-v8a/
          if-no-files-found: error

      - name: Upload injector
        uses: actions/upload-artifact@v4
        with:
          name: injector-arm64-v8a
          path: injector/outputs/arm64-v8a/injector
          if-no-files-found: error
